<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>react-project</title>
    <script>
      (() => {
        const root = document.documentElement
        const stored = localStorage.getItem("tweakcn-theme")
        let theme =
          stored ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "default-dark"
            : "default-light")

        let imported = null
        try {
          imported = JSON.parse(
            localStorage.getItem("tweakcn-imported-theme") || "null",
          )
        } catch {}

        const mode = theme.endsWith("-light") ? "light" : "dark"

        if (imported && imported.cssVars && imported.cssVars[mode]) {
          theme = "imported-" + mode
          const vars = Object.assign(
            {},
            imported.cssVars.theme || {},
            imported.cssVars[mode],
          )
          for (const key of Object.keys(vars)) {
            root.style.setProperty("--" + key, vars[key])
          }
        }

        root.setAttribute("data-theme", theme)
        root.classList.toggle("dark", mode === "dark")
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
